{id:'c1',name:'白衬衫与深色长裤',emoji:'👔',price:35,tag:'简洁',who:'me',rx:'你穿白衬衫？……挺利落。'},{id:'c2',name:'复古酒红连衣裙',emoji:'👗',price:66,tag:'漂亮',who:'me',rx:'他本来还在翻账本，笔尖却顿了一下。\n「今天打算让谁分心？」'},{id:'c3',name:'宽松针织衫',emoji:'🧶',price:45,tag:'柔软',who:'me',rx:'「这件看着舒服。」他伸手摸了摸袖口，很快又收回去。'},{id:'c4',name:'黑色皮夹克',emoji:'🧥',price:82,tag:'帅气',who:'me',rx:'「噢，今天跟我抢风头啊？」'},{id:'c5',name:'浅蓝碎花裙',emoji:'🌼',price:58,tag:'清新',who:'me',rx:'他看你一眼又看一眼。「喂……新买的？」'},{id:'c6',name:'工装背带裤',emoji:'👖',price:49,tag:'日常',who:'me',rx:'「这套不错，修东西也方便。」他笑着递来一枚螺丝。'},{id:'c7',name:'灰色卫衣',emoji:'🩶',price:42,tag:'休闲',who:'me',rx:'「像偷了我的衣服。」他挑眉笑。'},{id:'c8',name:'墨绿色旗袍',emoji:'🌿',price:95,tag:'复古',who:'me',rx:'他沉默得有点久，最后偏开眼：「……很衬你。」'},

const byId=id=>[...clothes,...furniture,...petGoods,...gifts].find(x=>x.id===id);
function fresh(){return {day:1,slot:0,money:250,aff:0,trust:10,mood:65,energy:90,stage:0,dating:false,cohabit:false,wear:'c1',lanWear:'初始衬衫',owned:['c1'],furn:[],ownedFurn:[],pet:{hunger:35,clean:85,joy:74,health:95,energy:82,diary:['第1天：新家有两个住得很近的人。我决定先观察。汪。'],gear:[],inv:{food:2,snack:1,shampoo:1,medicine:0}},gifts:{},work:{mins:0,streak:0,history:[]},lastTopics:[],talkCount:0,touches:0,giftDay:0,visitedDay:0,focus:null,focusEnd:0,notes:[],events:{},log:[{day:1,who:'蓝信一',text:'「喂，新来的助手。账本放桌上就好，别乱动我那一叠。」他笑得挺欠揍。'}],tab:'home',intro:true};}
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){s=fresh()}
const base=fresh();s={...base,...s,pet:{...base.pet,...s.pet,inv:{...base.pet.inv,...(s.pet||{}).inv}},work:{...base.work,...s.work},events:{...base.events,...s.events}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function clamp(v,a=0,b=100){return Math.max(a,Math.min(b,v))}function stage(){return STAGES.reduce((v,x,i)=>s.aff>=x.at?i:v,0)}function stName(){return STAGES[stage()].n}function slot(){return ['早晨','午后','夜晚'][s.slot]}function rnd(a){return a[Math.floor(Math.random()*a.length)]}function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function log(w,t){s.log.push({day:s.day,who:w,text:t});if(s.log.length>100)s.log.shift();save()}function msg(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),2600)}function gain(v,trust=0){s.aff=Math.max(0,s.aff+v);s.trust=clamp(s.trust+trust);s.mood=clamp(s.mood+(v>0?1:-2));save()}
const $=id=>document.getElementById(id);function btn(t,fn,kind=''){return `<button class="btn ${kind}" onclick="${fn}">${t}</button>`}function mbar(label,val,col=''){return `<div class="small">${label} · ${Math.round(val)}/100</div><div class="meter"><i class="${col}" style="width:${clamp(val)}%"></i></div>`}function picture(){const task=s.focus?'📒':s.slot===2?'📻':'📒';return `<div class="scene"><div class="window"></div><div class="desk"></div><div class="object">${task}</div><div class="figure">${s.visitedDay===s.day?'🚪':s.focus?'🧑🏻‍💼':'🧑🏻‍🦱'}</div><div class="dog">🐕</div><div class="label">${s.visitedDay===s.day?'出门办事 · 稍后回来':s.focus?'一起专注中':(s.cohabit?'共同的小家':'城寨 · 隔壁房间')}</div></div>`}
function render(){if(s.focus&&Date.now()>=s.focusEnd)finishFocus();let html=`<header class="top"><div class="eyebrow">KOWLOON CITY · PRIVATE LIFE STORY</div><h1>巷灯未熄 <span style="font-size:13px">✦ 与蓝信一的日常</span></h1><small>第 ${s.day} 天 · ${slot()}　｜　${stName()} ${s.cohabit?'· 同居中':s.dating?'· 交往中':''}</small><div class="stats"><span class="stat">♥ 好感 ${s.aff}</span><span class="stat">◇ 信任 ${s.trust}</span><span class="stat">☼ 心情 ${s.mood}</span><span class="stat">＄${s.money}</span></div></header><main class="main">`;
if(s.tab==='home')html+=home();if(s.tab==='talk')html+=talkPage();if(s.tab==='focus')html+=focusPage();if(s.tab==='dog')html+=dogPage();if(s.tab==='shop')html+=shopPage();html+=`</main><div class="footer">离线单机体验 · 存档保存在当前浏览器中。可从「日常」导出备份。自由输入基于本地情绪和关键词规则，并非真正的 AI 聊天。</div><nav class="nav">${[['home','🏠','日常'],['talk','💬','蓝信一'],['focus','⏳','专注'],['dog','🐕','薯仔'],['shop','🛍️','商店']].map(a=>`<button class="${s.tab===a[0]?'active':''}" onclick="go('${a[0]}')"><span>${a[1]}</span>${a[2]}</button>`).join('')}</nav>`; $('app').innerHTML=html; save()}
function go(t){s.tab=t;render()}
function home(){let unlocked=s.cohabit;return `<section class="card"><h2>城寨的这一天</h2>${picture()}<p class="hint">${s.visitedDay===s.day?'蓝信一去街口办事了。晚些时候才回来。':s.focus?'蓝信一安静地处理自己的事情，偶尔抬眼看看你。':s.slot===0?'窗外有人吆喝，蓝信一正核对账目。':s.slot===1?'午后的巷子有点吵，他拿着笔在账本上敲了敲。':'城寨灯火渐亮，收工之后他终于愿意慢下来。'}</p><div class="actions">${btn('去找蓝信一',"go('talk')",'primary')}${btn('推进时段','nextSlot()')}${btn('去打零工 ＋＄25','job()')}</div></section><section class="card"><h2>🏡 房间与日常</h2><p class="small">${unlocked?'你们已经一起住了。家具可以自由摆放、替换。':'你住在蓝信一隔壁的房间。现在只能布置自己的小屋；同居后才能装修共同房间。'}</p><div class="flags">${s.furn.length?s.furn.map(id=>`<span class="chip">${byId(id)?.emoji} ${byId(id)?.name}</span>`).join(''):'<span class="chip">🪑 一张旧木桌</span><span class="chip">🛏️ 一张小床</span>'}</div><div class="actions">${btn(unlocked?'装修我们的房间':'装修我的房间',"openFurn()")}${btn('换衣服','wardrobe()')}</div><p class="small">今日穿搭：${byId(s.wear)?.name||'日常便服'}　·　蓝信一：${esc(s.lanWear)}</p></section><section class="card"><h2>📜 日记与存档</h2><div class="log">${s.log.slice(-8).reverse().map(e=>`<div class="entry"><span class="muted">Day ${e.day}</span> <b>${esc(e.who)}</b><div>${esc(e.text)}</div></div>`).join('')}</div><div class="actions">${btn('导出存档','exportSave()')}${btn('导入存档','importSave()')}${btn('重新开始','resetPrompt()','warn')}</div></section>`}
function nextSlot(){if(s.focus){msg('专注正在进行，先完成或结束番茄钟。');return}if(s.slot===2){s.slot=0;s.day++;s.talkCount=0;s.touches=0;s.visitedDay=0;s.pet.hunger=clamp(s.pet.hunger+16);s.pet.clean=clamp(s.pet.clean-9);s.pet.joy=clamp(s.pet.joy-6);s.pet.energy=clamp(s.pet.energy+25);s.energy=clamp(s.energy+38);s.mood=clamp(s.mood+8);s.pet.health=clamp(s.pet.health+(s.pet.hunger>85||s.pet.clean<20?-13:3));if(s.pet.hunger>75||s.pet.clean<30)s.pet.diary.push(`第${s.day}天：今天${s.pet.hunger>75?'肚子有点空': '身上痒痒'}，有点不高兴。汪。`);else s.pet.diary.push(`第${s.day}天：新的一天。想和小律出去玩！`);if(s.pet.diary.length>45)s.pet.diary.shift();let e=Math.random();if(e<.22){s.visitedDay=s.day;log('巷口见闻','蓝信一一早出门办事，桌上留着句「我晚些回来」。')}else if(e<.43){log('蓝信一','他路过你的门口，顺手放下一袋热腾腾的点心。');gain(1,1)}else if(e<.57){log('薯仔','薯仔把小球叼到门边，等你醒来。')}else log('日常','城寨又迎来了新的一天。');}else {s.slot++;s.energy=clamp(s.energy-7);s.pet.hunger=clamp(s.pet.hunger+7);s.pet.clean=clamp(s.pet.clean-3);if(s.visitedDay===s.day&&s.slot===2){s.visitedDay=0;log('蓝信一','「回来了。」他把外套搭在椅背上，看上去有些疲惫。')}}render()}

const topics=[['今天怎么样','day'],['聊聊城寨','city'],['夸他一句','praise'],['故意逗他','tease'],['问他忙不忙','busy'],['聊薯仔','dog'],['邀请一起吃饭','eat'],['聊我们的关系','relation'],['谈心事','heart'],['问他喜欢什么','like'],['说晚安','night'],['主动说想他','miss']];
function talkPage(){let away=s.visitedDay===s.day;return `<section class="card"><h2>💬 蓝信一</h2><div class="small">${away?'当前状态：出门办事中':s.focus?'当前状态：和你一起专注':s.slot===0?'当前状态：核对账本':s.slot===1?'当前状态：处理街坊的事情':'当前状态：休息时间'}　·　情绪 ${s.mood>=68?'轻松':s.mood>=35?'平静':'烦躁'}</div>${mbar('好感进度',Math.min(100,s.aff/105*100),'warm')}${mbar('信任',s.trust)}<p class="hint">初期他把你当助手，对越界接触会拒绝。好感、信任与交往阶段会慢慢打开新的互动。</p>${away?`<div class="bubble"><span class="who">蓝信一</span>\n「去街口办点事，桌上的账本别给我弄丢了。」</div>`:`<div class="bubble"><span class="who">蓝信一</span>\n${esc(currentLine())}</div>`}<div class="divider"></div><h3>找个话题</h3><div class="actions">${topics.map(([name,id])=>btn(name,`topic('${id}')`,away?'':'')).join('')}</div><h3>随便说一句（自由输入）</h3><textarea id="freeTalk" class="field" maxlength="180" placeholder="例如：你今天是不是累了？／我给你买了汽水／为什么总盯着我看？"></textarea><div class="actions">${btn('发送给他','freeTalk()','primary')}</div><div class="divider"></div><h3>主动做点什么</h3><div class="actions">${btn('👋 打招呼',"act('hello')")}${btn('✋ 牵手',"touch('hand')",'pink')}${btn('🫂 抱抱',"openTouch('hug')",'pink')}${btn('💋 亲吻',"openTouch('kiss')",'pink')}${btn('🛋️ 亲密时光',"touch('private')",'pink')}${btn('🎁 送礼物','giftMenu()')}${btn('👕 送他新衣服','giveClothes()')}</div><p class="hint">亲密互动会区分方式和位置；彼此的心情和关系进度都会影响结果。</p></section><section class="card"><h2>最近的对话</h2><div class="log">${s.log.filter(e=>['你','蓝信一'].includes(e.who)).slice(-12).map(e=>`<div class="entry"><b>${esc(e.who)}</b> <span class="muted">第${e.day}天</span><div>${esc(e.text)}</div></div>`).join('')}</div></section>`}
function currentLine(){if(s.focus)return rnd(['「先把自己的事做好，别偷看我。」','「做完这段再休息。」','他低头翻账本，手里的笔转了一圈。']);if(s.mood<30)return rnd(['「今天有点烦。你先坐着，等我忙完。」','他用手指轻敲桌面，抬眼看你：「怎么了？」']);if(stage()>=4)return rnd(['「过来坐。账本这种东西，永远都看不完。」','他倚着桌沿看你：「今天想我没有？」','「薯仔刚才又偷睡我的位置。你管不管？」']);if(stage()>=2)return rnd(['「这么巧，又来找我？」他笑起来。','他把笔夹在指间：「找我聊天，还是想捉弄我？」','「喂，你今天看起来心情不错。」']);return rnd(['「有什么事？如果是账本的事，直接说。」','他手里转着笔，语气随意：「嗯？找我？」','「新来的，今天熟悉这里了没有？」'])}
function reply(text,opt={}){if(s.visitedDay===s.day){msg('他现在外出了，晚些再找他。');return}if(s.focus){msg('专注中，等休息时再聊天。');return}if(s.talkCount>=12){msg('今天聊太久啦，明天再来找他。');return}let before=stage();s.talkCount++;let delta=opt.aff||0; if(s.talkCount>7&&delta>0)delta=0;gain(delta,opt.trust||0);log('蓝信一',text);if(stage()>before)log('关系变化',`你们之间的距离变成了「${stName()}」。`);render();}
function topic(id){if(s.visitedDay===s.day||s.focus){msg('他现在暂时没空。');return}let a={day:[['「忙啊，城寨哪天不忙？不过你来得正好。」',1],['「今天不怎么样。不过还好有你能听我抱怨两句。」',2]],city:[['「住久了就习惯。这里乱归乱，也有人情味。」',1],['「巷口那家铺子的老板，小时候还给我留过饭。」',1]],praise:[['他笑着抬了抬眉：「这么会说话？想让我帮你做什么？」',2],['「你再夸两句，我可真要当真了。」',2]],tease:[['「哎，你胆子越来越大了。」他把笔转得飞快。',2],['他被你噎住一秒，随后笑着凑近：「有本事再说一遍？」',2]],busy:[['「账目是麻烦，不过我能处理。」',1],['他叹气，合上账本：「好吧，休息五分钟。」',1]],dog:[['「薯仔比某些人还聪明。」他笑着朝你瞟了一眼。',2],['他蹲下摸摸薯仔：「是个乖小子，至少今天是。」',1]],eat:[['「走吧，带你去吃点好东西。」',3],['「请我吃？那我可不会客气。」',2]],relation:[[stage()<2?'「怎么突然问这个？我们不是合作得挺好？」':stage()<4?'他收了笑意：「我以为你早就看出来了。」':'「我们的关系？你要我再说一遍喜欢你？」',2]],heart:[['他认真听完，放慢了语气：「别什么都自己扛。」',2],['「你要是想说，我就听着。」',2]],like:[['「汽水、好看的墨镜……还有不用出错的账本。」',1],['「喜欢什么？这种问题，可不一定能随便回答。」',1]],night:[['「晚安。明天别睡过头。」',1],['「困了就去睡。……睡个好觉。」',2]],miss:[[stage()<2?'「才多久没见？」他笑着摆手，却又多看了你一眼。':stage()<4?'他指尖一顿：「……你这人，讲话真没预兆。」':'「巧了，我也是。」他伸手勾住你的小指。',3]]};let o=rnd(a[id]);log('你',topics.find(x=>x[1]===id)[0]);reply(o[0],{aff:o[1],trust:id==='heart'?2:0});}
function freeTalk(){let el=$('freeTalk');if(!el)return;let t=el.value.trim();if(!t){msg('先写点什么吧。');return}if(s.visitedDay===s.day||s.focus){msg('他现在暂时没空。');return}log('你',t);let x=t.toLowerCase(),lvl=stage(),ans='',aff=1,trust=0;const has=(...v)=>v.some(q=>x.includes(q));if(has('累','辛苦','休息','忙')){ans=rnd(['他搁下笔，揉了揉眉心：「被你看出来了？还行。」','「你也别只顾着我。自己的事做好了？」']);aff=2;trust=2}else if(has('难过','委屈','害怕','担心','哭','压力','烦恼')){ans=lvl<2?'他难得认真：「怎么了？慢慢说，我听着。」':'他走近一些，压低声音：「别急，我在这儿。你想说就说。」';aff=2;trust=3}else if(has('喜欢你','爱你','在一起','交往','做我男朋友')){ans=lvl<2?'他的笑僵了一瞬：「喂，别突然拿这个开玩笑……我会当真的。」':lvl<4?'他看着你，笑意收了一点：「这话你想清楚了？我可不是听完就忘的人。」':'「我知道。」他笑着轻轻碰了碰你的手。';aff=lvl<2?1:3}else if(has('想你','想念')){ans=lvl<2?'「今天才见过吧？」他嘴上这么说，眼神却有点躲。':'「嗯？」他靠过来，低声说：「我也想你。」';aff=3}else if(has('亲','抱','牵手')){ans=lvl<2?'他笑着岔开话题：「这么突然？先把手头的活做好。」':'「嘴上说得倒挺大胆。」他朝你伸了伸手。';aff=1}else if(has('薯仔','小狗','狗狗')){ans=rnd(['「它刚才还把我的鞋当枕头。」','「别给它吃太多零食，知道吗？」']);aff=2}else if(has('汽水','绿宝','礼物','送你')){ans='他歪头一笑：「还记得我喜欢什么？挺上心嘛。」';aff=2}else if(has('穿','衣服','裙子','好看','漂亮','帅')){ans=lvl<2?'「你今天倒是挺会打扮。」':'他盯着你看了一会儿：「……你明知道我会多看两眼。」';aff=2}else if(has('生气','讨厌','烦你','走开','别理我')){ans='他没再逗你，沉默几秒：「好，你想一个人待会儿，我就不吵你。」';aff=-2;trust=-1}else if(has('早安','早上好','晚安','你好')){ans=rnd(['「嗯，早。睡得好吗？」','「晚安。别又熬到太晚。」','「喂，今天看起来很精神。」']);aff=1}else if(has('为什么','怎么','吗','？','?')){ans=rnd(['他想了想：「你想听认真的回答，还是想听我逗你？」','「这个嘛……你先说说你怎么想。」','他把笔搁下：「我在听，你继续。」']);aff=1}else{ans=rnd(lvl>=3?['他笑着看你：「然后呢？我想听你多讲一点。」','「我知道了。」他顺手替你把桌上的东西挪开。','「你这人啊……」他语气轻快，眼神却很专注。']:['「嗯，我听着。」他停下手里的笔。','「还有呢？」他往椅背一靠。','「你这么说，倒也有道理。」他点了点头。']);aff=1}reply(ans,{aff,trust})}
function act(id){if(id==='hello'){log('你','朝他挥挥手。');reply(rnd(['他转过脸，懒洋洋地挥了挥手。','「又来了？」他嘴角带笑。']),{aff:1});}}
function openTouch(type){let arr=type==='hug'?[['正面轻抱','hugFront'],['从背后抱住他','hugBack'],['靠进他的怀里','hugLean'],['抱住他的腰','hugWaist']]:[['亲脸颊','kissCheek'],['亲额头','kissForehead'],['轻吻嘴唇','kissLip'],['亲手背','kissHand']];showModal(type==='hug'?'想怎么抱他？':'想亲哪里？',`<div class="actions">${arr.map(a=>btn(a[0],`closeModal();touch('${a[1]}')`)).join('')}</div><p class="hint">亲密需要双方愿意；关系尚未达到时，他会明确拒绝。</p>`)}
function touch(id){if(s.focus||s.visitedDay===s.day){msg('他现在没空。');return}if(s.touches>=5){msg('今天亲密互动够多啦，留点时间给彼此。');return}let lvl=stage(),need=id==='hand'?2:id.startsWith('hug')?3:id.startsWith('kiss')?4:4;s.touches++;let isPrivate=id==='private';if(lvl<need||s.mood<28||(isPrivate&&!s.dating)){log('你',`${id==='hand'?'试着牵他的手':id.startsWith('hug')?'想抱抱他':id.startsWith('kiss')?'想亲吻他':'试着邀请他共度亲密时光'}。`);let resp=lvl<need?'他轻轻避开，语气不凶，却很明确：「喂……我们还没到那一步吧。」':'他揉揉眉心：「今天有点累，改天好不好？」';gain(-1);log('蓝信一',resp);render();return}let map={hand:['他先是愣了一下，随后反手握紧你：「这么主动？」','他的小指勾住你的指尖，笑得一脸得逞。'],hugFront:['他张开手臂接住你，下巴轻轻抵在你发顶。','「怎么了？」他笑着收拢手臂，抱得很稳。'],hugBack:['他的动作停住：「偷袭？」随后轻轻覆住你环在腰间的手。','「喂，账本都快看不成了。」他笑着没挣开。'],hugLean:['他让出半边位置，把你安稳揽进怀里。','「靠着吧。」他低头看你，声音软了点。'],hugWaist:['他低头看着你放在腰间的手：「嗯？今天怎么这么黏人。」','他笑着扶住你的背：「这样就满意了？」'],kissCheek:['你亲了他脸颊一下。他微微怔住，耳根发红：「偷袭也算？」','他偏过头，笑着说：「还挺会挑地方。」'],kissForehead:['他低下头让你亲到额头，随后故意说：「这算给我的奖励？」','你碰了碰他的额头，他握着你的手笑了。'],kissLip:['他认真地回应了这个轻吻，分开时还不忘笑你：「怎么不敢看我？」','他先停顿了一瞬，随后轻轻吻回来，掌心贴在你的后背。'],kissHand:['他看着你亲过的手背，轻声笑了：「学我的？」','他反过来牵住你的手：「礼尚往来？」'],private:['他握住你的手，低声问你是否真的愿意。得到彼此肯定后，灯光慢慢暗了下去。那是只属于两个人的夜晚。','他把账本合上，认真确认了你的心意。窗外灯影摇晃，接下来的时间留给了你们。']};log('你',({'hand':'牵住他的手','hugFront':'正面抱住他','hugBack':'从身后抱住他','hugLean':'靠进他怀里','hugWaist':'环住他的腰','kissCheek':'亲他的脸颊','kissForehead':'亲他的额头','kissLip':'轻吻他的嘴唇','kissHand':'亲吻他的手背','private':'邀请他共度亲密时光'})[id]);gain(id==='private'?3:2,2);log('蓝信一',rnd(map[id]));render()}
function relationAdvance(){if(s.focus){msg('专注中不能谈这件事。');return}let lvl=stage();if(!s.dating){if(lvl<4||s.trust<45){msg('还需要更深的好感与信任，才能认真确认关系。');return}showModal('确认恋人关系',`<p>蓝信一收起一贯吊儿郎当的笑，认真地看着你。<br>「不是随便逗你。你愿不愿意正式跟我在一起？」</p><div class="actions">${btn('我愿意',"chooseDate()",'primary')}${btn('再想想','closeModal()')}</div>`)}else if(!s.cohabit){if(s.aff<125||s.trust<65){msg('同居还需要更多相处和信任（好感125、信任65）。');return}showModal('同居邀请',`<p>「隔壁那间房总是跑来跑去的。」他把钥匙放在桌上，耳根有些发红。<br>「要不……以后就住一起？」</p><div class="actions">${btn('好呀，一起住',"chooseCohabit()",'primary')}${btn('先不要','closeModal()')}</div>`)}else msg('你们已经一起住啦。')}
function chooseDate(){s.dating=true;gain(5,7);log('蓝信一','「那就说好了。」他笑着牵住你的手，「以后是我女朋友了。」');closeModal();render()}

function giftMenu(){let a=gifts.filter(g=>(s.gifts[g.id]||0)>0);showModal('送蓝信一礼物',a.length?`<div class="grid">${a.map(g=>`<div class="item"><div class="emoji">${g.emoji}</div><strong>${g.name} ×${s.gifts[g.id]}</strong>${btn('送给他',`sendGift('${g.id}')`,'primary')}</div>`).join('')}</div>`:'<p>背包里还没有礼物，先去商店买一点吧。</p>')}
function sendGift(id){if(s.visitedDay===s.day||s.focus){msg('他现在不在或正在专注。');return}if(s.giftDay===s.day){msg('今天已经送过礼物啦。');return}let g=byId(id);s.gifts[id]--;s.giftDay=s.day;let change=g.score+(id==='g1'?3:0);gain(change,2);log('你',`送给蓝信一「${g.name}」。`);log('蓝信一',id==='g1'?'他接过绿宝汽水，眉眼都亮了一点：「哎，懂我啊。」':rnd(['「专门给我挑的？」他小心收好，笑着看你。','「谢啦。」他嘴上轻描淡写，却把东西拿在手里看了好几遍。']));closeModal();render()}
function giveClothes(){let a=clothes.filter(c=>c.who==='lan'&&s.owned.includes(c.id));showModal('给蓝信一送衣服',a.length?`<div class="grid">${a.map(c=>`<div class="item"><div class="emoji">${c.emoji}</div><strong>${c.name}</strong>${btn('送给他',`offerCloth('${c.id}')`)}</div>`).join('')}</div>`:'<p>还没买给他的衣服。可以先去服装店逛逛。</p>')}
function offerCloth(id){if(s.focus||s.visitedDay===s.day){msg('他现在没空。');return}let c=byId(id);if(stage()<2){log('蓝信一',`他接过「${c.name}」却有点迟疑：「给我？太客气了……先放着吧。」`);gain(1);closeModal();render();return}let accept=Math.random()>(s.mood<40?.65:.15);if(accept){s.lanWear=c.name;gain(3,1);log('蓝信一',`他试穿了「${c.name}」，朝你一挑眉：「眼光不错嘛。」`)}else{log('蓝信一',`他笑着收下「${c.name}」：「我喜欢，不过今天先不换，好不好？」`);gain(1)}closeModal();render()}
function focusPage(){let active=!!s.focus;let left=active?Math.max(0,Math.ceil((s.focusEnd-Date.now())/1000)):0;return `<section class="card"><h2>⏳ 和蓝信一一起专注</h2><p class="small">输入你今天要做的事、选择时长，然后现实时间同步倒计时。你学习，他会处理账本、写字、整理东西，也可能偷偷转笔、玩蝴蝶刀或者逗你一下。</p>${active?`<div style="text-align:center;padding:15px"><div class="eyebrow" style="color:var(--gold)">FOCUS IN PROGRESS</div><div style="font-size:39px;font-family:serif" id="clock">${fmt(left)}</div><h2>${esc(s.focus.task)}</h2><p class="small" id="focusLan">${esc(s.focus.action)}</p><p class="hint">页面保持打开时，每隔一段时间他的动作可能发生变化。</p>${btn('提前结束（不计入完成）','cancelFocus()','warn')}</div>`:`<label class="small">我现在要做什么？</label><input class="field" id="task" maxlength="65" placeholder="例如：复习营销研究／写作业／整理房间"><div style="height:9px"></div><label class="small">专注时长</label><select class="field" id="mins"><option value="5">5分钟 · 体验</option><option value="15">15分钟</option><option value="25" selected>25分钟 · 标准番茄钟</option><option value="45">45分钟</option><option value="60">60分钟</option><option value="90">90分钟</option></select><div class="actions">${btn('我们开始吧','startFocus()','primary')}</div>`}</section><section class="card"><h2>📚 一起完成的事</h2><div class="three"><div class="item"><strong>${s.work.mins}</strong><span class="small">累计分钟</span></div><div class="item"><strong>${s.work.streak}</strong><span class="small">完成次数</span></div><div class="item"><strong>${s.work.history.length}</strong><span class="small">历史记录</span></div></div><div class="divider"></div><div class="log">${s.work.history.slice(-10).reverse().map(x=>`<div class="entry">第${x.day}天 · ${esc(x.task)} · ${x.mins}分钟</div>`).join('')||'<p class="small">今天要不要一起认真一点？</p>'}</div></section>`}
function fmt(sec){return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function startFocus(){let t=($('task')?.value||'').trim(),v=Number($('mins')?.value);if(!t){msg('先告诉他你要完成什么。');return}if(![5,15,25,45,60,90].includes(v))return;s.focus={task:t,mins:v,start:Date.now(),action:'蓝信一摊开账本：「好，开始。谁先分心谁请汽水。」',phase:0};s.focusEnd=Date.now()+v*60000;log('共同专注',`你开始「${t}」（${v}分钟）。蓝信一陪你一起做事。`);render()}
function tick(){if(!s.focus)return;let sec=Math.max(0,Math.ceil((s.focusEnd-Date.now())/1000));if(sec<=0){finishFocus();render();return}if($('clock'))$('clock').textContent=fmt(sec);let phase=Math.floor((Date.now()-s.focus.start)/45000);if(phase>s.focus.phase){s.focus.phase=phase;let x=rnd(['他把一页账本翻过去，写下几行数字。','他把墨水笔在指间转了一圈，差点掉在桌上。','他看你专注的样子，悄悄推来一杯水。','他检查了桌上的票据，偶尔捏捏眉心。','他拿起蝴蝶刀熟练地转了两下，又收好继续做事。','「喂，专心。」他故意用笔尖轻轻敲了敲桌面。','薯仔打了个哈欠，蓝信一忍着笑伸手摸了它的头。']);s.focus.action=x;if($('focusLan'))$('focusLan').textContent=x;save()}}
setInterval(tick,1000);
function finishFocus(){if(!s.focus)return;let f=s.focus;s.work.mins+=f.mins;s.work.streak++;s.work.history.push({day:s.day,task:f.task,mins:f.mins});s.money+=Math.max(5,Math.round(f.mins/5)*5);gain(2,2);log('共同专注',`完成了「${f.task}」，持续${f.mins}分钟。蓝信一把账本合上：「做得不错。休息一会儿？」`);s.focus=null;s.focusEnd=0;save();msg(`完成 ${f.mins} 分钟！默契＋2，赚到一点零用钱。`)}
function cancelFocus(){s.focus=null;s.focusEnd=0;log('共同专注','这次专注提前结束。休息一下再来。');render()}
function dogPage(){let p=s.pet,ill=p.health<48;return `<section class="card"><h2>🐕 薯仔的生活</h2><div style="text-align:center;font-size:77px;padding:6px">🐕</div><p style="text-align:center">${ill?'🤒 今天有点不舒服':p.hunger>75?'🥺 肚子好饿':p.clean<25?'🛁 想洗澡':p.joy<35?'🥲 有点寂寞':p.joy>75?'🥰 摇尾巴，非常开心':'🐾 正在四处探险'}</p>${mbar('饥饿（越低越好）',p.hunger,'warm')}${mbar('清洁',p.clean)}${mbar('快乐',p.joy,'warm')}${mbar('健康',p.health)}${mbar('体力',p.energy)}<div class="actions">${btn(`🥣 喂狗粮 (${p.inv.food||0})`,`petAct('feed')`,'primary')}${btn(`🦴 给零食 (${p.inv.snack||0})`,`petAct('snack')`)}${btn(`🫧 洗澡 (${p.inv.shampoo||0})`,`petAct('wash')`)}${btn(`💊 照顾治疗 (${p.inv.medicine||0})`,`petAct('heal')`)}${btn('🐕 遛狗',`petAct('walk')`)}${btn('🤲 摸摸',`petAct('pet')`)}${btn('🎾 玩游戏',`petAct('play')`)}</div><p class="hint">注意：饥饿度太高、清洁度太低会降低心情和健康。生病后需要照顾，不能只靠玩耍恢复。</p></section><section class="card"><h2>🧺 薯仔的小窝</h2><div class="flags">${p.gear.length?p.gear.map(id=>`<span class="chip">${byId(id)?.emoji} ${byId(id)?.name}</span>`).join(''):'<span class="chip">还没有装饰</span>'}</div><p class="small">背包：狗粮 ${p.inv.food||0} · 零食 ${p.inv.snack||0} · 沐浴露 ${p.inv.shampoo||0} · 药品 ${p.inv.medicine||0}</p>${btn('去宠物用品店',"go('shop')")}</section><section class="card"><h2>📔 薯仔日记</h2><div class="log">${p.diary.slice(-20).reverse().map(t=>`<div class="entry">${esc(t)}</div>`).join('')}</div></section>`}
function petAct(a){let p=s.pet,txt='',need={feed:'food',snack:'snack',wash:'shampoo',heal:'medicine'}[a];if(need&&!(p.inv[need]>0)){msg('库存不足，去宠物店买吧。');return}if(need)p.inv[need]--;if(a==='feed'){p.hunger=clamp(p.hunger-35);p.joy=clamp(p.joy+5);txt='吃到了香喷喷的饭！尾巴摇得像风扇。'}if(a==='snack'){p.hunger=clamp(p.hunger-12);p.joy=clamp(p.joy+12);txt='零食是天下第一快乐的东西！'}if(a==='wash'){p.clean=clamp(p.clean+58);p.joy=clamp(p.joy-2);txt='洗澡的时候有点不情愿，但是现在香香的。'}if(a==='heal'){p.health=clamp(p.health+37);p.joy=clamp(p.joy+5);txt='被好好照顾啦，感觉好多了。'}if(a==='walk'){if(p.energy<12){msg('薯仔太累啦，明天再遛吧。');return}p.hunger=clamp(p.hunger+13);p.clean=clamp(p.clean-11);p.joy=clamp(p.joy+22);p.energy=clamp(p.energy-20);txt='在巷子里闻到了好多好多味道！蓝信一还偷偷给我挠耳朵。'}if(a==='play'){if(p.energy<10){msg('薯仔现在想睡觉。');return}p.joy=clamp(p.joy+(p.gear.includes('ball')||p.gear.includes('rope')?23:13));p.energy=clamp(p.energy-14);p.hunger=clamp(p.hunger+9);txt='今天和小律玩得很开心！';}if(a==='pet'){p.joy=clamp(p.joy+6);txt='被摸摸脑袋，呼噜噜，好喜欢。'}if(p.hunger>83||p.clean<17){p.health=clamp(p.health-5);p.joy=clamp(p.joy-7)}else if(p.health<100&&p.hunger<65&&p.clean>40)p.health=clamp(p.health+2);p.diary.push(`第${s.day}天：${txt}`);if(p.diary.length>45)p.diary.shift();log('薯仔',txt);render()}
function shopPage(){return `<section class="card"><h2>🛍️ 巷口商店街</h2><p class="small">目前零用钱：＄${s.money}。零用钱可通过打零工和完成专注获得。</p><div class="actions">${btn('👕 服装店',"shopSection('clothes')")}${btn('🪑 家具店',"shopSection('furn')")}${btn('🎁 礼品铺',"shopSection('gifts')")}${btn('🐕 宠物店',"shopSection('pet')")}</div><div id="shelf"></div></section>`}
function shopSection(type){let data={clothes,furn:furniture,gifts,pet:petGoods}[type];$('shelf').innerHTML=`<div class="divider"></div><div class="grid">${data.map(v=>`<div class="item"><div class="emoji">${v.emoji}</div><strong>${esc(v.name)}</strong><div class="small">${esc(v.desc||v.tag||(type==='gifts'?'给蓝信一的小礼物':'薯仔的日用品'))}</div><div style="margin:9px 0"><span class="badge">＄${v.price}</span>${type==='clothes'?`<span class="badge">${v.who==='me'?'你的':'蓝信一的'}</span>`:''}</div>${btn(s.owned.includes(v.id)||s.ownedFurn.includes(v.id)||s.pet.gear.includes(v.id)?'已拥有':`购买 ＄${v.price}`,`buy('${v.id}','${type}')`,'primary')}</div>`).join('')}</div>`}
function buy(id,type){let item=byId(id);if(!item)return;let unique=type==='clothes'?s.owned:type==='furn'?s.ownedFurn:type==='pet'&&['ball','rope','bed','collar','brush'].includes(id)?s.pet.gear:null;if(unique?.includes(id)){msg('这个已经买过啦。');return}if(s.money<item.price){msg('钱不够，先去打零工或者专注赚一点。');return}s.money-=item.price;if(type==='clothes')s.owned.push(id);else if(type==='furn'){s.ownedFurn.push(id);s.furn.push(id);}else if(type==='gifts')s.gifts[id]=(s.gifts[id]||0)+1;else if(type==='pet'){if(unique)unique.push(id);else{let n={food:3,snack:3,shampoo:2,medicine:1}[id];s.pet.inv[id]=(s.pet.inv[id]||0)+n}}log('购物',`购买了「${item.name}」，花费＄${item.price}。`);render();if(s.tab==='shop')shopSection(type);msg(`买到「${item.name}」！`)}
function openFurn(){showModal(s.cohabit?'装修我们的房间':'装修我的房间',`<p class="small">${s.cohabit?'这些家具现在摆在你们一起生活的房间里。':'这里是你的邻居小屋。等到同居后才会开启共同生活的房间。'}</p><div class="grid">${s.furn.map(id=>{let f=byId(id);return `<div class="item"><div class="emoji">${f.emoji}</div><strong>${f.name}</strong>${btn('收起','removeFurn(\''+id+'\')')}</div>`}).join('')||'<p class="small">还没有买家具。到家具店看看吧。</p>'}</div><div class="divider"></div><h3>仓库里的家具</h3><div class="actions">${s.ownedFurn.filter(id=>!s.furn.includes(id)).map(id=>btn(byId(id)?.emoji+' 摆放 '+byId(id)?.name,`placeFurn('${id}')`)).join('')||'<span class="small">没有收起的家具</span>'}</div><p class="hint">家具一旦购买永久拥有，「收起」只会从房间移走，不会退款。</p>`)}
function placeFurn(id){if(s.ownedFurn.includes(id)&&!s.furn.includes(id))s.furn.push(id);closeModal();render();msg('家具已经摆好了。')}
function removeFurn(id){s.furn=s.furn.filter(x=>x!==id);closeModal();render();msg('家具暂时收起来了。')}
function wardrobe(){let own=clothes.filter(c=>c.who==='me'&&s.owned.includes(c.id));showModal('今日穿搭',`<div class="grid">${own.map(c=>`<div class="item"><div class="emoji">${c.emoji}</div><strong>${c.name}</strong>${btn(c.id===s.wear?'正穿着':'换上',`wear('${c.id}')`,'primary')}</div>`).join('')}</div><p class="hint">每种衣服都有他自己的看法。</p>`)}
function wear(id){if(!s.owned.includes(id))return;s.wear=id;let c=byId(id);if(s.visitedDay!==s.day){log('蓝信一',stage()<2?`他打量你的「${c.name}」，点点头：「新衣服？不错。」`:c.rx);gain(stage()>=2?2:1)}closeModal();render()}
function showModal(title,content){closeModal();let el=document.createElement('div');el.id='modal';el.className='modalBack';el.onclick=e=>{if(e.target===el)closeModal()};el.innerHTML=`<div class="modal"><div class="row"><h2 class="grow">${title}</h2><button class="btn" onclick="closeModal()">✕</button></div>${content}</div>`;document.body.append(el)}function closeModal(){document.getElementById('modal')?.remove()}
function exportSave(){let a=document.createElement('a');let file=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});a.href=URL.createObjectURL(file);a.download=`巷灯未熄_第${s.day}天_存档.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);msg('存档已导出，请妥善保管 JSON 文件。')}
function importSave(){showModal('导入存档','<p class="small">选择此前导出的 JSON 存档。导入会覆盖当前进度。</p><input id="importFile" type="file" accept=".json,application/json" class="field"><div class="actions">'+btn('确定导入','loadSave()','primary')+'</div>')}
function loadSave(){let f=$('importFile')?.files?.[0];if(!f){msg('先选一个存档文件。');return}let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.pet||!x.log||typeof x.day!=='number')throw Error('invalid');s={...fresh(),...x};save();closeModal();render();msg('存档导入成功！')}catch(e){msg('这个文件不是有效存档。')}};r.readAsText(f)}
function resetPrompt(){showModal('重新开始？',`<p>这会清空当前浏览器里的游戏进度。建议先导出存档。</p><div class="actions">${btn('取消','closeModal()')}${btn('确定清空','resetGame()','warn')}</div>`)}function resetGame(){s=fresh();save();closeModal();render()}
function intro(){if(!s.intro)return;showModal('城寨来信 · 第一日',`<p>清晨的楼道里还带着潮气。你抱着纸箱搬进了蓝信一隔壁的小房间，打算从今天起替他打理一些杂事。</p><p>屋里，一个穿着随意的年轻人正低头核对账本。听见动静，他把笔一转，抬眼看过来。</p><p>「你就是新来的助手？我叫蓝信一。先说好——工作别给我添乱，其他的嘛……慢慢熟就知道。」</p><p>你脚边的边牧薯仔『汪』了一声。他低头看了看狗，轻轻笑起来。</p><p>从助手和邻居开始，你们的故事才刚刚开始。</p><div class="actions">${btn('开始我们的日常',"s.intro=false;closeModal();render()",'primary')}</div>`)}
// Provide relationship milestone in both home and talk areas, always accessible from dialogue.
const oldTalkPage=talkPage;talkPage=function(){let h=oldTalkPage();let anchor='<div class="divider"></div><h3>主动做点什么</h3>';h=h.replace(anchor,`<div class="divider"></div><h3>我们的关系</h3><p class="small">${s.dating?(s.cohabit?'已经是恋人，也已经同居。':'已经确认交往，可以继续培养信任，商量同居。'):'目前还没有确认交往。需要好感达到105、信任达到45。'}</p><div class="actions">${btn(s.dating?(s.cohabit?'一起生活中':'提出同居'):'认真确认关系','relationAdvance()','pink')}</div>`+anchor);return h};
render();intro();
</script></body></html>
